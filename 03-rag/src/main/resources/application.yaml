spring:
  application:
    name: spring-ai-rag
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Microsoft Foundry configuration via spring-ai-starter-model-openai
  ai:
    openai:
      base-url: ${AZURE_OPENAI_ENDPOINT}
      api-key: ${AZURE_OPENAI_API_KEY}
      microsoft-deployment-name: ${AZURE_OPENAI_FAST_DEPLOYMENT}
      chat:
        model: ${AZURE_OPENAI_FAST_DEPLOYMENT}
      embedding:
        model: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}

server:
  port: 8081

app:
  rag:
    chunking:
      # Tokens per chunk. Small chunks keep one topic per embedding: measured against
      # sample-document.txt, a specific question scores 0.29 at 300 tokens but 0.41 at 150,
      # because a larger chunk averages the relevant sentence away.
      chunk-size: 150
    search:
      max-results: 5
      # text-embedding-3-small returns a compressed score range. On this corpus a correct
      # match scores ~0.41 while unrelated chunks sit at 0.14-0.21, so 0.35 separates them;
      # the previous 0.5 rejected every correct match for specific questions.
      similarity-threshold: 0.35

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    "[com.example.springai]": DEBUG
    "[org.springframework.ai]": DEBUG
    "[org.springframework]": INFO
