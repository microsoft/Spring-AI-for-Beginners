server:
  port: 8083
  # Disable compression to prevent Chrome from buffering SSE streams.
  # Compressed SSE responses are not delivered incrementally in Chrome.
  compression:
    enabled: false

spring:
  application:
    name: prompt-engineering
  mvc:
    async:
      request-timeout: -1
  # Microsoft Foundry configuration via spring-ai-starter-model-openai
  ai:
    openai:
      base-url: ${AZURE_OPENAI_ENDPOINT}
      api-key: ${AZURE_OPENAI_API_KEY}
      microsoft-deployment-name: ${AZURE_OPENAI_DEPLOYMENT}
      # Spring AI ignores its own timeout properties here (verified: a 19s call still
      # succeeded with timeout set to 10s) and holds the SDK at 60s. Retries DO apply,
      # so keep them at 1 rather than burning 4 x 60s on a slow prompt.
      max-retries: 1
      chat:
        model: ${AZURE_OPENAI_DEPLOYMENT}
        max-retries: 1

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    "[com.example.springai.prompts]": DEBUG
    "[org.springframework.ai]": INFO

